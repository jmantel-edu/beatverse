<!-- Rhythm / Multiversal -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panic Room</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <h1>Panic Room</h1>
    <div id="sidePanel">
        <button id="restart" style="color: red; background-color: black;" onclick="restart(false)">Restart...</button>
        <h1 id="timer" style="color: black;">30:00</h1>
    </div>
    <div id="story">
        <img id="image">
        <p id="text"></p>
        <p id="recommendation" style="color:green"></p>
        <p id="choices"></p>
        <input id="code" type="text" placeholder="Enter a code..." >
        <p id="error" style="color: red;"></p>
    </div>
</body>
</html>
